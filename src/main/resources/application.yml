spring:
  application:
    name: focus-app-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017}
      database: ${MONGODB_DATABASE:focusapp}

server:
  port: ${SERVER_PORT:8080}

jwt:
  # SECURITY WARNING: The default secret below is for DEVELOPMENT ONLY!
  # In production, ALWAYS set JWT_SECRET environment variable to a secure random string (minimum 256 bits / 32 characters)
  # Generate a secure secret with: openssl rand -base64 32
  secret: ${JWT_SECRET:dev-secret-key-CHANGE-THIS-IN-PRODUCTION-minimum-256-bits-required-for-HS256-algorithm}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  show-actuator: false

logging:
  level:
    com.focusapp: DEBUG
    org.springframework.data.mongodb: DEBUG
    org.springframework.security: DEBUG
